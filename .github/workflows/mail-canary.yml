name: Mail Canary

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mail-canary:
    runs-on: ubuntu-latest
    env:
      MAIL_CANARY_FROM: smtp@nafsheini.org
      MAIL_CANARY_WAIT_SECONDS: "180"
      MAIL_CANARY_POLL_INTERVAL_SECONDS: "10"
      MAIL_CANARY_ATAVYA_BASE: https://app.atavya.com
      MAIL_CANARY_ATAVYA_TEST_EMAIL: shrage@smilowitz.com
      MAIL_CANARY_ATAVYA_WAIT_SECONDS: "120"
      MAIL_CANARY_ATAVYA_POLL_INTERVAL_SECONDS: "10"
      MAIL_CANARY_TARGETS_JSON: >-
        [{"name":"direct-oneteamforward","address":"shrage@oneteamforward.com","verify_kind":"imap","verify_host":"mail.oneteamforward.com","verify_port":993,"verify_password_env":"MAIL_CANARY_ONETEAM_IMAP_PASSWORD","verify_user":"shrage@oneteamforward.com","verify_mailbox":"INBOX","atavya_scope":"personal"},{"name":"direct-smilowitz","address":"shrage@smilowitz.com","verify_kind":"imap","verify_host":"mail.oneteamforward.com","verify_port":993,"verify_password_env":"MAIL_CANARY_SMILOWITZ_IMAP_PASSWORD","verify_user":"shrage@smilowitz.com","verify_mailbox":"INBOX"},{"name":"org-nafsheini","address":"shrage@nafsheini.org","verify_kind":"imap","verify_host":"mail.oneteamforward.com","verify_port":993,"verify_password_env":"MAIL_CANARY_NAFSHEINI_IMAP_PASSWORD","verify_user":"office@nafsheini.org","verify_mailbox":"INBOX"}]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run mail canary tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run external mail canaries
        id: probe
        continue-on-error: true
        env:
          MAIL_CANARY_SMTP_HOST: mail.smtp2go.com
          MAIL_CANARY_SMTP_PORT: "2525"
          MAIL_CANARY_SMTP_STARTTLS: "true"
          MAIL_CANARY_SMTP_USERNAME: ${{ secrets.MAIL_CANARY_SMTP_USERNAME }}
          MAIL_CANARY_SMTP_PASSWORD: ${{ secrets.MAIL_CANARY_SMTP_PASSWORD }}
          MAIL_CANARY_ONETEAM_IMAP_PASSWORD: ${{ secrets.MAIL_CANARY_ONETEAM_IMAP_PASSWORD }}
          MAIL_CANARY_SMILOWITZ_IMAP_PASSWORD: ${{ secrets.MAIL_CANARY_ONETEAM_IMAP_PASSWORD }}
          MAIL_CANARY_NAFSHEINI_IMAP_PASSWORD: ${{ secrets.MAIL_CANARY_NAFSHEINI_IMAP_PASSWORD }}
          MAIL_CANARY_ATAVYA_CLERK_SECRET_KEY: ${{ secrets.MAIL_CANARY_ATAVYA_CLERK_SECRET_KEY }}
          MAIL_CANARY_ATAVYA_CLERK_PUBLISHABLE_KEY: ${{ secrets.MAIL_CANARY_ATAVYA_CLERK_PUBLISHABLE_KEY }}
        run: |
          if ! python .github/scripts/mail_canary.py probe > mail-canary-results.json; then
            if [ ! -s mail-canary-results.json ]; then
              printf '{"ok": false, "results": []}\n' > mail-canary-results.json
            fi
            exit 1
          fi

      - name: Render issue body
        if: always()
        run: python .github/scripts/mail_canary.py issue-body mail-canary-results.json > mail-canary-issue.md

      - name: Add workflow summary
        if: always()
        run: cat mail-canary-issue.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update status issue on failure
        if: steps.probe.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Mail Canary: external email delivery failure"
          issue_number=$(gh issue list --state all --limit 100 --json number,title,state --jq '.[] | select(.title=="'"$ISSUE_TITLE"'") | .number' | head -n1)
          if [ -z "$issue_number" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file mail-canary-issue.md --label status
          else
            issue_state=$(gh issue view "$issue_number" --json state --jq '.state')
            if [ "$issue_state" = "CLOSED" ]; then
              gh issue reopen "$issue_number"
            fi
            gh issue edit "$issue_number" --body-file mail-canary-issue.md
          fi

      - name: Close status issue on recovery
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Mail Canary: external email delivery failure"
          issue_number=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title=="'"$ISSUE_TITLE"'") | .number' | head -n1)
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file mail-canary-issue.md
            gh issue close "$issue_number"
          fi
